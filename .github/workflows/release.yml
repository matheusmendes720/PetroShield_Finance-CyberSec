# Release — triggered by a tag push of the form `v*` (e.g. `v0.1.0`).
#
# What it does:
#   1. Build the production bundle.
#   2. Create a GitHub Release with auto-generated notes.
#   3. Attach the `dist/` build artifact to the release.
#
# Netlify deploy: handled by Netlify's official GitHub App integration, which
# is connected in the Netlify dashboard. Once linked, pushes to `main` (and
# previews on PRs) deploy automatically. This workflow does NOT call the
# Netlify API directly — that path is brittle and duplicates the App.
#
# The Express server (server.ts) is NOT included in the Netlify deploy. To
# ship the backend, deploy it to a Netlify Function (./netlify/functions/) or
# to a separate host (Render / Fly / Railway). For static-only deploys the
# `dist/` artifact is the right attach target.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build · Publish GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/**/*
